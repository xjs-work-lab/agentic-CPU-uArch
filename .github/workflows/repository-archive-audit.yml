name: Complete Repository Archive Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit-all-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enumerate all files and validate every local Markdown link
        run: |
          python analysis/graph/repository_archive_audit.py \
            --json archive-tree-audit.json \
            --markdown archive-tree-audit.md \
            --strict-links
      - name: Upload full audit results (including on errors)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-repository-archive-audit
          path: |
            archive-tree-audit.json
            archive-tree-audit.md
          retention-days: 30
