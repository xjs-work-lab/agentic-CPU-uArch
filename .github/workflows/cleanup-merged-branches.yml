name: One-time merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged migration branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "migration/MIG-20261006-02-A-CG06"
            "migration/MIG-20261006-02-PTA"
            "migration/MIG-20261006-02-C"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
