<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1070" viewBox="0 0 2048 1070" role="img" aria-label="现有 SME2 与编译布局协同仍提供有证据的 CPU 优化空间"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2473B6"/></marker></defs><rect x="0" y="0" width="2048" height="1070" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" /><rect x="70" y="51" width="9" height="110" rx="2" fill="#2473B6" stroke="none" stroke-width="1" /><text x="100" y="106" fill="#102C55" font-size="48" font-weight="760" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">现有 SME2 与编译布局协同仍提供有证据的 CPU 优化空间</text><text x="101" y="158" fill="#58738A" font-size="22" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">SME2 在 CPU 核内部；实测收益要写清平台、模型、指标与对照基线</text><path d="M78 206 H1970" stroke="#C9DBEA" stroke-width="2"/><rect x="69" y="244" width="887" height="685" rx="14" fill="#FFFFFF" stroke="#C9DBEA" stroke-width="1.7" /><rect x="69" y="244" width="887" height="66" rx="14" fill="#E7F2FD" stroke="none" stroke-width="1" /><rect x="69" y="287" width="887" height="23" rx="0" fill="#E7F2FD" stroke="none" stroke-width="1" /><text x="97" y="287" fill="#174478" font-size="27" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">SME / SME2 是 AArch64 CPU 核内的 ISA 扩展</text><rect x="103" y="329" width="818" height="104" rx="13" fill="#E7F2FD" stroke="#ACCAE3" stroke-width="1.5" /><text x="512" y="373" fill="#174478" font-size="26" font-weight="740" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">LLVM / MLIR  →  形状与精度感知 lowering</text><text x="512" y="410" fill="#58738A" font-size="22" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">tiling · fusion · packing · 数据布局复用</text><path d="M512 437 L512 476" fill="none" stroke="#2473B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr)"/><rect x="104" y="488" width="817" height="305" rx="14" fill="#FFFFFF" stroke="#95BAD9" stroke-width="2.1" /><rect x="123" y="508" width="780" height="53" rx="9" fill="#EDF4FA" stroke="none" stroke-width="1" /><text x="513" y="546" fill="#174478" font-size="25" font-weight="730" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">AArch64 CPU 核（非 SME 独立处理器）</text><rect x="130" y="592" width="239" height="145" rx="11" fill="#E7F2FD" stroke="#A1BFDD" stroke-width="1.6" /><text x="249" y="643" fill="#174478" font-size="24" font-weight="750" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">标量 / 控制</text><text x="249" y="681" fill="#173753" font-size="20" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">调度 / 状态操作</text><text x="249" y="711" fill="#58738A" font-size="18" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">通用 CPU 执行</text><rect x="384" y="592" width="239" height="145" rx="11" fill="#E7F2FD" stroke="#A1BFDD" stroke-width="1.6" /><text x="503" y="643" fill="#174478" font-size="24" font-weight="750" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">SIMD / 向量</text><text x="503" y="681" fill="#173753" font-size="20" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">向量化 / 归约</text><text x="503" y="711" fill="#58738A" font-size="18" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">与矩阵流水协同</text><rect x="638" y="592" width="239" height="145" rx="11" fill="#E7F2FD" stroke="#A1BFDD" stroke-width="1.6" /><text x="757" y="643" fill="#174478" font-size="24" font-weight="750" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">SME / SME2</text><text x="757" y="681" fill="#173753" font-size="20" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">矩阵 tile 运算</text><text x="757" y="711" fill="#58738A" font-size="18" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">ZA 与 streaming 状态</text><rect x="105" y="829" width="815" height="73" rx="11" fill="#F7F9FD" stroke="#C9DBEA" stroke-width="1.3" /><text x="511" y="861" fill="#174478" font-size="22" font-weight="700" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">软件：优化算子形状、权重布局与流水协作</text><text x="511" y="889" fill="#58738A" font-size="18" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">GPU / NPU 属 SoC 的其他异构引擎，不是 CPU 内的 SME。</text><rect x="986" y="244" width="992" height="685" rx="14" fill="#FFFFFF" stroke="#C9DBEA" stroke-width="1.7" /><rect x="986" y="244" width="992" height="66" rx="14" fill="#E7F2FD" stroke="none" stroke-width="1" /><rect x="986" y="287" width="992" height="23" rx="0" fill="#E7F2FD" stroke="none" stroke-width="1" /><text x="1014" y="287" fill="#174478" font-size="27" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">手机实证：vivo X300 · SqueezeSAM · 单 CPU 核</text><rect x="1025" y="332" width="908" height="244" rx="11" fill="#F7F9FD" stroke="#C9DBEA" stroke-width="1.2" /><text x="1050" y="372" fill="#174478" font-size="25" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">INT8 · 单核 CPU 端到端延迟（ms；越短越好）</text><text x="1053" y="430" fill="#173753" font-size="23" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">优化前</text><rect x="1247" y="400" width="482" height="38" rx="6" fill="#A9C3D7" stroke="none" stroke-width="1" /><text x="1757" y="430" fill="#173753" font-size="25" font-weight="690" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">555.8 ms</text><text x="1053" y="500" fill="#173753" font-size="23" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">SME2 路径</text><rect x="1247" y="470" width="264" height="38" rx="6" fill="#2473B6" stroke="none" stroke-width="1" /><text x="1534" y="500" fill="#174478" font-size="25" font-weight="690" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">304.1 ms</text><text x="1050" y="546" fill="#58738A" font-size="18" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">相同精度组内按优化前延迟归一化条长</text><rect x="1025" y="596" width="908" height="244" rx="11" fill="#F7F9FD" stroke="#C9DBEA" stroke-width="1.2" /><text x="1050" y="638" fill="#174478" font-size="25" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">FP16 · 单核 CPU 端到端延迟（ms；越短越好）</text><text x="1053" y="690" fill="#173753" font-size="23" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">优化前</text><rect x="1247" y="661" width="482" height="38" rx="6" fill="#A9C3D7" stroke="none" stroke-width="1" /><text x="1757" y="690" fill="#173753" font-size="25" font-weight="690" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">1163.0 ms</text><text x="1053" y="757" fill="#173753" font-size="23" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">SME2 路径</text><rect x="1247" y="728" width="124" height="38" rx="6" fill="#2473B6" stroke="none" stroke-width="1" /><text x="1394" y="757" fill="#174478" font-size="25" font-weight="690" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">298.2 ms</text><text x="1050" y="805" fill="#58738A" font-size="18" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">相同精度组内按优化前延迟归一化条长</text><text x="1027" y="892" fill="#58738A" font-size="20" font-weight="480" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">注意：第一方视觉分割研究 ≠ Agent 任务 / CPU 与 NPU 的直接比较。</text><path d="M75 950 H1973" stroke="#C9DBEA" stroke-width="2"/><text x="86" y="987" fill="#58738A" font-size="19" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">数据来源：PyTorch / Arm ExecuTorch + XNNPACK + KleidiAI（TOOL-012），vivo X300 SqueezeSAM CPU 路径。</text><text x="86" y="1018" fill="#58738A" font-size="19" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">机理来源：SMEPilot（PAPER-052）；其 Apple M4 Pro 能耗数据不是手机测量，不在本页混用。</text></svg>