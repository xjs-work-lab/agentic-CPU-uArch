<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1070" viewBox="0 0 2048 1070" role="img" aria-label="2027—2029 应先做强现有 ISA 与软件，再条件性研究硬件残差"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2473B6"/></marker></defs><rect x="0" y="0" width="2048" height="1070" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" /><rect x="70" y="51" width="9" height="110" rx="2" fill="#2473B6" stroke="none" stroke-width="1" /><text x="100" y="106" fill="#102C55" font-size="48" font-weight="760" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">2027—2029 应先做强现有 ISA 与软件，再条件性研究硬件残差</text><text x="101" y="158" fill="#58738A" font-size="22" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">建议路线：按 CPU/LLVM、Runtime/OS、可信动作、内存和低功耗五层拆解</text><path d="M78 206 H1970" stroke="#C9DBEA" stroke-width="2"/><rect x="70" y="241" width="1908" height="687" rx="14" fill="#FFFFFF" stroke="#C9DBEA" stroke-width="1.7" /><rect x="70" y="241" width="1908" height="66" rx="14" fill="#E7F2FD" stroke="none" stroke-width="1" /><rect x="70" y="284" width="1908" height="23" rx="0" fill="#E7F2FD" stroke="none" stroke-width="1" /><text x="98" y="284" fill="#174478" font-size="27" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">同一技术层逐年深化，硬件仅在额外可复核证据成立后重审</text><rect x="90" y="319" width="1862" height="69" rx="9" fill="#174478" stroke="none" stroke-width="1" /><text x="227" y="364" fill="#FFFFFF" font-size="28" font-weight="750" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">技术层</text><text x="631" y="364" fill="#FFFFFF" font-size="27" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">2027：工程基础</text><text x="1147" y="364" fill="#FFFFFF" font-size="27" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">2028：跨层协作</text><text x="1682" y="364" fill="#FFFFFF" font-size="27" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">2029：持续与条件研究</text><rect x="90" y="399" width="1862" height="91" rx="7" fill="#FFFFFF" stroke="#C9DBEA" stroke-width="1" /><rect x="90" y="399" width="275" height="91" rx="7" fill="#E7F2FD" stroke="none" stroke-width="1" /><text x="227" y="437" fill="#174478" font-size="23" font-weight="720" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">CPU / LLVM</text><text x="227" y="468" fill="#58738A" font-size="18" font-weight="400" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">现有 ISA</text><text x="405" y="436" fill="#173753" font-size="22" font-weight="510" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">SME2 / AArch64 lowering</text><text x="405" y="468" fill="#58738A" font-size="20" font-weight="440" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">微内核、packing 与布局复用</text><text x="921" y="436" fill="#173753" font-size="22" font-weight="510" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">CPU↔NPU 的能力感知放置</text><text x="921" y="468" fill="#58738A" font-size="20" font-weight="440" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">可移植编译/Runtime 合同</text><rect x="1421" y="407" width="520" height="75" rx="7" fill="#F7F9FD" stroke="#9EBFD9" stroke-width="1.25" stroke-dasharray="8 6"/><text x="1437" y="436" fill="#174478" font-size="22" font-weight="680" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">持续：现有 ISA 优化</text><text x="1437" y="468" fill="#58738A" font-size="20" font-weight="440" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start">条件：新语义 ISA 需物理收益证据</text><rect x="90" y="497" width="